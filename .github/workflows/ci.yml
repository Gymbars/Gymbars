# Verificaciones automáticas. NO despliega nada: los despliegues se hacen con `npm run deploy:<entorno>`
# desde la computadora (ver DEPLOY.md).
name: CI

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Guardia, sintaxis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guardia (sin datos personales ni secretos nuevos)
        run: npm run guard
      - name: Sintaxis de los .gs y de los scripts del navegador
        run: npm run check
      - name: Pruebas
        run: npm test

  ui:
    name: Prueba de interfaz (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recorrer el panel, el escáner y el móvil
        run: CHROME_PATH="$(which google-chrome)" node tools/ui-check.mjs ui-shots
      - name: Guardar capturas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots
