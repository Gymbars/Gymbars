<style>
  /* ==================== NAVBAR · CHALK & STEEL ==================== */

  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 900;
    height: calc(var(--nav-height) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background-color: rgba(7, 8, 10, 0.92);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--color-text);
    box-shadow: inset 0 -1px 0 var(--chalk-line);
    transition: box-shadow 0.25s ease;
  }

  .navbar.is-scrolled {
    box-shadow: inset 0 -1px 0 var(--chalk-line), 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .navbar-inner {
    max-width: var(--container);
    height: var(--nav-height);
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .navbar-brand {
    font-size: 22px;
    font-weight: 800;
    font-stretch: 75%;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--color-text);
    margin-right: auto;
  }

  .navbar-menu {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .navbar-links,
  .navbar-social {
    display: flex;
    align-items: center;
    list-style: none;
    gap: 4px;
  }

  .navbar-social {
    margin-left: 12px;
    gap: 2px;
  }

  .navbar-link {
    display: inline-block;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(242, 240, 235, 0.68);
    transition: color 0.2s ease;
  }

  .navbar-link:hover,
  .navbar-link.is-active {
    color: var(--color-text);
  }

  .navbar-link.is-active {
    box-shadow: inset 0 -2px 0 var(--color-accent);
  }

  .navbar-link--admin {
    color: #93C5FD !important;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .navbar-link--admin:hover {
    color: #BFDBFE !important;
  }

  .navbar-social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    font-size: 17px;
    color: rgba(242, 240, 235, 0.7);
    transition: color 0.2s ease;
  }

  .navbar-social-link:hover {
    color: var(--color-accent);
  }

  .navbar-toggle {
    display: none;
    width: 42px;
    height: 42px;
    padding: 10px 9px;
    flex-direction: column;
    justify-content: space-between;
  }

  .navbar-toggle span {
    display: block;
    height: 2px;
    width: 100%;
    background: var(--color-text);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .navbar-toggle[aria-expanded="true"] span:nth-child(1) {
    transform: translateY(9px) rotate(45deg);
  }

  .navbar-toggle[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }

  .navbar-toggle[aria-expanded="true"] span:nth-child(3) {
    transform: translateY(-9px) rotate(-45deg);
  }

  @media (max-width: 860px) {
    .navbar-toggle {
      display: flex;
    }

    .navbar-menu {
      position: fixed;
      top: calc(var(--nav-height) + env(safe-area-inset-top));
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      padding: 8px 20px 24px;
      background-color: var(--color-navbar);
      box-shadow: inset 0 1px 0 var(--chalk-line);
      transform: translateY(-8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    }

    .navbar-menu.is-open {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .navbar-links {
      flex-direction: column;
      align-items: stretch;
    }

    .navbar-link {
      display: block;
      padding: 16px 0;
      font-size: 15px;
      box-shadow: inset 0 -1px 0 var(--chalk-line);
    }

    .navbar-link.is-active {
      box-shadow: inset 0 -1px 0 var(--chalk-line), inset 3px 0 0 var(--color-accent);
      padding-left: 12px;
    }

    .navbar-social {
      margin: 20px 0 0;
      justify-content: center;
      gap: 10px;
    }

    body.menu-open {
      overflow: hidden;
    }
  }
</style>
