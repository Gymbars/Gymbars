<style>
  /* ==================== PORTADA · CHALK & STEEL ==================== */

  .muted {
    color: var(--chalk-muted);
    font-size: 15px;
  }

  /* ---------- Hero a sangre ---------- */

  .hero {
    position: relative;
    height: min(100svh - var(--nav-height), 880px);
    min-height: 560px;
    background: #000;
    overflow: hidden;
    color: #fff;
  }

  .hero-carousel {
    position: absolute;
    inset: 0;
    background: #000;
  }

  .hero-carousel::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(to top, rgba(11, 12, 14, 0.96) 0%, rgba(11, 12, 14, 0.55) 38%, rgba(11, 12, 14, 0.15) 70%),
      linear-gradient(to right, rgba(11, 12, 14, 0.55) 0%, rgba(11, 12, 14, 0) 60%);
  }

  .hero-carousel-track {
    position: absolute;
    inset: 0;
  }

  .carousel-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s;
  }

  .carousel-slide.is-active {
    opacity: 1;
    visibility: visible;
  }

  .carousel-slide .media {
    width: 100%;
    height: 100%;
    background-color: #0b0b0b;
  }

  .carousel-slide .media--empty {
    background-image: linear-gradient(135deg, #1B1E25, #0B0C0E 70%);
  }

  .carousel-slide .media--empty::after {
    color: rgba(242, 240, 235, 0.18);
  }

  .hero-copy {
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(44px, 9vh, 104px);
    z-index: 3;
    text-align: left;
  }

  .hero-title {
    font-size: clamp(76px, 15vw, 214px);
    font-weight: 800;
    font-stretch: 75%;
    line-height: 0.84;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    color: #fff;
  }

  .hero-lead {
    margin-top: 22px;
    max-width: 540px;
    font-size: clamp(17px, 2vw, 21px);
    line-height: 1.4;
    color: rgba(242, 240, 235, 0.86);
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
  }

  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--color-text);
    background: rgba(11, 12, 14, 0.5);
    box-shadow: inset 0 0 0 1px var(--chalk-line);
    transition: background-color 0.2s ease;
  }

  .carousel-arrow:hover {
    background: rgba(11, 12, 14, 0.85);
  }

  .carousel-arrow--prev { left: 20px; }
  .carousel-arrow--next { right: 20px; }

  /* Indicadores como barras: la misma línea del resto de la página */
  .carousel-dots {
    position: absolute;
    right: 20px;
    top: 22px;
    z-index: 5;
    display: flex;
    gap: 6px;
  }

  .carousel-dot {
    width: 28px;
    height: 3px;
    background: rgba(242, 240, 235, 0.3);
    transition: background-color 0.3s ease;
  }

  .carousel-dot.is-active {
    background: var(--color-text);
  }

  /* ---------- Qué ofrecemos ---------- */

  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0;
    border-top: 1px solid var(--chalk-line);
  }

  .feature-card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 28px 28px 0 0;
  }

  .feature-card + .feature-card {
    padding-left: 28px;
    border-left: 1px solid var(--chalk-line);
  }

  .feature-media {
    width: 100%;
    aspect-ratio: 4 / 3;
  }

  .feature-title {
    font-size: 26px;
    font-weight: 800;
    font-stretch: 75%;
    line-height: 1;
    text-transform: uppercase;
  }

  .feature-desc {
    font-size: 16px;
    color: var(--chalk-muted);
    max-width: 360px;
  }

  /* ---------- Horario + contacto ---------- */

  .two-columns {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 56px;
    align-items: start;
  }

  .schedule {
    border-top: 1px solid var(--chalk-line);
  }

  .schedule-group {
    display: grid;
    grid-template-columns: 128px 1fr;
    border-bottom: 1px solid var(--chalk-line);
  }

  .schedule-day {
    display: flex;
    align-items: center;
    padding: 18px 16px;
    font-size: 15px;
    font-weight: 800;
    font-stretch: 75%;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
  }

  .schedule-rows {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .schedule-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 0 18px 22px;
    font-size: 18px;
  }

  .schedule-row + .schedule-row {
    border-top: 1px solid var(--chalk-line);
  }

  .schedule-shift {
    white-space: nowrap;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--chalk-muted);
  }

  .schedule-time {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
  }

  .contact-card {
    background-color: var(--color-contact);
    color: var(--color-text);
    padding: 36px 32px;
    border-top: 3px solid var(--color-accent);
  }

  .contact-block + .contact-block {
    margin-top: 32px;
    padding-top: 32px;
    border-top: 1px solid var(--chalk-line);
  }

  .contact-heading {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-muted);
    margin-bottom: 12px;
  }

  .contact-heading i {
    margin-right: 6px;
  }

  .contact-phone {
    display: inline-block;
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 800;
    font-stretch: 75%;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    color: var(--color-text);
    transition: color 0.2s ease;
  }

  .contact-phone:hover {
    color: var(--color-accent);
  }

  .contact-social {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .contact-social a {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 6px 0;
    font-size: 18px;
    color: var(--color-text);
    transition: color 0.2s ease;
  }

  .contact-social a:hover {
    color: var(--color-accent);
  }

  .contact-social i {
    width: 24px;
    text-align: center;
    font-size: 20px;
  }

  /* ---------- Rutinas: barras ---------- */

  .programs-grid {
    display: flex;
    flex-direction: column;
    margin-top: 48px;
    border-top: 1px solid var(--chalk-line);
    text-align: left;
  }

  .program-card + .program-card {
    border-top: 1px solid var(--chalk-line);
  }

  .program-button {
    position: relative;
    display: grid;
    grid-template-columns: clamp(120px, 16vw, 200px) minmax(0, 1fr) auto;
    align-items: center;
    gap: clamp(20px, 3vw, 40px);
    width: 100%;
    padding: 20px 0;
    text-align: left;
    transition: padding 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* La línea de tiza que se llena al pasar el mouse */
  .program-button::after {
    content: '';
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 2px;
    width: 0;
    background: var(--color-accent);
    transition: width 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .program-button:hover::after,
  .program-button:focus-visible::after {
    width: 100%;
  }

  .program-button:hover {
    padding-left: 12px;
  }

  .program-media {
    aspect-ratio: 4 / 3;
  }

  .program-title {
    font-size: clamp(30px, 4.6vw, 60px);
    font-weight: 800;
    font-stretch: 75%;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--color-text);
  }

  .program-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--chalk-muted);
    transition: color 0.2s ease;
  }

  .program-button:hover .program-cta {
    color: var(--color-accent);
  }

  .program-cta i {
    font-size: 12px;
    transition: transform 0.3s ease;
  }

  .program-button:hover .program-cta i {
    transform: translateX(5px);
  }

  /* ---------- Ubicación ---------- */

  .address {
    margin-bottom: 32px;
  }

  .address-line {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .address-line--muted {
    font-weight: 400;
    font-style: italic;
    color: var(--chalk-muted);
  }

  .map-wrapper {
    position: relative;
    border: 1px solid var(--chalk-line);
    overflow: hidden;
    background: var(--color-section);
  }

  .map-wrapper iframe {
    display: block;
    width: 100%;
    height: 440px;
    border: 0;
    filter: grayscale(0.85) contrast(1.05);
  }

  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding: 14px 22px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text);
    box-shadow: inset 0 0 0 1px var(--chalk-line);
    transition: color 0.2s ease, box-shadow 0.2s ease;
  }

  .map-link:hover {
    color: var(--color-accent);
    box-shadow: inset 0 0 0 1px var(--color-accent);
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 980px) {
    .features-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .feature-card:nth-child(3) {
      padding-left: 0;
      border-left: 0;
    }
  }

  @media (max-width: 820px) {
    .two-columns {
      grid-template-columns: 1fr;
      gap: 56px;
    }
  }

  @media (max-width: 640px) {
    .hero {
      min-height: 620px;
    }

    .features-grid {
      grid-template-columns: 1fr;
    }

    .feature-card,
    .feature-card + .feature-card {
      padding: 26px 0;
      border-left: 0;
    }

    .feature-card + .feature-card {
      border-top: 1px solid var(--chalk-line);
    }

    .feature-card:nth-child(3) {
      padding-left: 0;
    }

    .carousel-arrow {
      display: none;
    }

    .carousel-dots {
      right: 16px;
      top: 16px;
    }

    .program-button {
      grid-template-columns: 96px minmax(0, 1fr);
      padding: 16px 0;
    }

    .program-cta {
      display: none;
    }

    .program-media.media--empty::after {
      font-size: 9px;
      letter-spacing: 1px;
    }

    .program-title {
      font-size: 30px;
    }

    .schedule-group {
      grid-template-columns: 1fr;
    }

    .schedule-row {
      padding-left: 16px;
    }

    .map-wrapper iframe {
      height: 320px;
    }
  }
</style>
