<style>
  /* ==========================================================================
     GYMBARS — Estilos base · Dirección "Chalk & Steel"
     Suelo de acero casi negro, tiza blanca, un solo color de acción.
     Los colores se sobrescriben en tiempo de ejecución desde la pestaña "Sitio".
     ========================================================================== */

  :root {
    --color-navbar: #07080A;
    --color-bg: #0B0C0E;
    --color-section: #121418;
    --color-text: #F2F0EB;
    --color-text-light: #F2F0EB;
    --color-accent: #A9AFBA;
    --color-accent-ink: #0B0C0E;
    --color-saturday: #3A3D44;
    --color-sunday: #8E1B1B;
    --color-contact: #1A1D23;

    --chalk-line: rgba(242, 240, 235, 0.14);
    --chalk-muted: rgba(242, 240, 235, 0.68);

    --font-base: 'Archivo', 'Helvetica Neue', Arial, sans-serif;

    --nav-height: 60px;
    --container: 1200px;
    --radius: 2px;
    --shadow-card: 0 18px 40px rgba(0, 0, 0, 0.45);
    --shadow-hover: 0 24px 50px rgba(0, 0, 0, 0.6);
  }

  *,
  *::before,
  *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: var(--nav-height);
  }

  body {
    font-family: var(--font-base);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.5;
    color: var(--color-text);
    background-color: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    padding-top: var(--nav-height);
    padding-top: calc(var(--nav-height) + env(safe-area-inset-top));
    overflow-x: hidden;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 3px;
  }

  ::selection {
    background: var(--color-accent);
    color: var(--color-accent-ink);
  }

  /* ==========================================================================
     LAYOUT
     ========================================================================== */

  .container {
    width: 100%;
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 20px;
  }

  .section {
    padding: 110px 0;
    background-color: var(--color-bg);
    border-top: 1px solid var(--chalk-line);
  }

  .section--alt {
    background-color: var(--color-section);
  }

  .text-center {
    text-align: center;
  }

  /* Título de sección: condensado, pesado, en mayúsculas. */
  .section-title {
    font-size: clamp(46px, 7vw, 96px);
    font-weight: 800;
    font-stretch: 75%;
    line-height: 0.92;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    margin-bottom: 14px;
    color: var(--color-text);
  }

  .section-divider {
    display: none;
  }

  .section-lead {
    max-width: 680px;
    margin: 0 auto;
    font-size: 18px;
    color: var(--chalk-muted);
  }

  .subsection-title {
    font-size: 34px;
    font-weight: 800;
    font-stretch: 75%;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: -0.005em;
    margin-bottom: 26px;
  }

  /* ==========================================================================
     BOTONES
     ========================================================================== */

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 28px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
  }

  .btn--primary {
    background: var(--color-accent);
    color: var(--color-accent-ink);
  }

  .btn--primary:hover {
    background: #C9CED6;
  }

  .btn--light {
    background: transparent;
    color: var(--color-text);
    box-shadow: inset 0 0 0 1px var(--chalk-line);
  }

  /* ==========================================================================
     IMÁGENES / PLACEHOLDERS
     ========================================================================== */

  .media {
    position: relative;
    width: 100%;
    overflow: hidden;
    background-color: var(--color-section);
    background-image: linear-gradient(135deg, #1B1E25, #0E1014);
    background-size: cover;
    background-repeat: no-repeat;
  }

  .media--empty::after {
    content: 'Gymbars';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    font-stretch: 75%;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(242, 240, 235, 0.22);
  }

  .media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .media-img--contain {
    object-fit: contain !important;
  }

  .media--empty .media-img {
    display: none;
  }

  /* ==========================================================================
     ANIMACIONES
     ========================================================================== */

  .fade-in {
    animation: fadeIn 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ==========================================================================
     RESPONSIVE
     ========================================================================== */

  @media (max-width: 720px) {
    .section {
      padding: 72px 0;
    }

    .subsection-title {
      font-size: 28px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
